<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS Game</title>
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header>
        <h1>Rock, Paper, Scissors, SHOOT!</h1>
    </header>
    <section class="game-text">
        <p>First to 5 points wins!</p>
    </section>
    <section class="game">
        <div class="hud">
            <div class="player user">
                <h2>YOU: <span class="score">0</span></h2>
                <p class="choice">👤</p>  
            </div>
             <div class="player cpu">
                <h2>CPU: <span class="score">0</span></h2>
                <p class="choice">🤖</p>   
             </div>
        </div>
        <div class="options">
            <div class="option">Rock</div>
            <div class="option">Paper</div>
            <div class="option">Scissors</div>
        </div>
    </section>
    <div class="modal-overlay">
        <div class="modal-box">
            <p class="winner-text"></p>
            <p class="final-score"></p>
            <button class="play-again">Play again</button>
        </div>
    </div>
</body>
</html>
